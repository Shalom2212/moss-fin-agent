[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-fin-agent"
version = "0.1.0"
description = "Autonomous Spend Policy & Invoice Reconciliation Agent with HITL Guardrails and Evaluation Benchmark Suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shalom (@Shalom2212)" }
]
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
